name: flagship

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flagship
      POSTGRES_PASSWORD: flagship
      POSTGRES_DB: flagship
    ports:
      # 5433 on the host, not 5432. A natively installed PostgreSQL is common on
      # developer machines and silently wins the binding, so connections land on
      # the wrong server and fail authentication in a way that looks like a
      # credentials bug rather than a port conflict.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flagship']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: flagship
      CLICKHOUSE_PASSWORD: flagship
      CLICKHOUSE_DB: flagship
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # ClickHouse binds IPv4 only; "localhost" resolves to ::1 here and is refused.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
